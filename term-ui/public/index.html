}
async function loadInbox() {
  const open = await getJson("/api/inbox?status=open&limit=100");
  if (!Array.isArray(open)) return;
  setCounts(open.length, open.filter(i => i.kind === "approval").length);
  if (!inboxOpenNow()) return;
  const items = INBOX.tab === "open" ? open : await getJson("/api/inbox?status=all&limit=100");
  if (!Array.isArray(items)) return;
  INBOX.items = items;
  paintInbox();
}
function paintInbox() {
  const list = $("inboxList");
  const keep = new Set(INBOX.items.map(i => i.id));
  for (const [id, c] of inboxEls) if (!keep.has(id)) { c.el.remove(); inboxEls.delete(id); }
  list.querySelector(".empty")?.remove();
  for (const item of INBOX.items) {
    const sig = JSON.stringify(item);
    const old = inboxEls.get(item.id);
    if (old?.sig === sig) continue;
    const el = inboxCard(item);
    if (old) old.el.replaceWith(el);
    inboxEls.set(item.id, { el, sig });
  }
  const want = INBOX.items.map(i => inboxEls.get(i.id).el);
  if (want.some((el, i) => list.children[i] !== el)) list.append(...want);
  if (!want.length) list.append(mk("p", "empty", t(INBOX.tab === "open" ? "inbox.empty" : "inbox.emptyAll")));
}
function inboxCard(item) {
  const open = item.status === "open";
  const el = mk("article", "inb");
  el.dataset.h = open ? KIND_H[item.kind] ?? "off" : "off";
  el.dataset.st = open ? "open" : "closed";
  const top = mk("div", "inb-top");
  const kind = mk("span", "pill", tIf(`inbox.kind${cap(item.kind)}`, item.kind));
  kind.dataset.h = KIND_H[item.kind] ?? "off";
  top.append(kind);
  if (!open) {
    const st = mk("span", "pill", tIf(`inbox.status${cap(item.status)}`, item.status));
    st.dataset.h = STATUS_H[item.status] ?? "off";
    top.append(st);
  }
  const canOpen = !!byRoute(item.route);
  const route = mk(canOpen ? "button" : "span", "inb-route", item.route);
  if (canOpen) { route.type = "button"; route.onclick = () => openRoute(item.route); }
  const when = mk("span", "mono", ago(item.ts));
  when.title = new Date(item.ts).toLocaleString(LANG);
  top.append(route, mk("span", "spacer"), when);
  const ctl = mk("div", "inb-ctl");
  const err = mk("div", "formerr");
  err.hidden = true;
  // An open approval already shows the full input in its editor, and a question often repeats its title: hide the echo.
  const echo = (item.kind === "approval" && open) || item.body === item.title;
  // Issue items carry the issue code as title: show the localized issue text when this UI has one.
  const title = item.kind === "issue" && item.data?.code ? tIf(`issue.${item.data.code}`, item.title) : item.title;
  el.append(top, mk("div", "inb-title", title), mk("div", "inb-body", echo ? "" : item.body), ctl, err);
  const button = (cls, text, onclick) => {
    const b = mk("button", `btn ${cls}`.trim(), text);
    b.type = "button";
    b.onclick = onclick;
    return b;
  };
  const act = async (action, body = {}) => {
    err.hidden = true;
    el.setAttribute("aria-busy", "true");
    const r = await api(`/api/inbox/${item.id}/${action}`, body).catch(() => null);
    if (r?.ok) return void (await Promise.all([loadInbox(), refresh()]));
    el.removeAttribute("aria-busy");
    err.textContent = r ? await r.text() : t("conn.down");
    err.hidden = false;
  };
  const textInput = (rows, ph) => {
    const area = mk("textarea");
    area.rows = rows;
    area.placeholder = ph;
    area.setAttribute("aria-label", ph);
    return area;
  };

  if (item.kind === "approval") {
    const tool = mk("div", "inb-tool");
    tool.append(mk("span", "", t("inbox.tool")), mk("span", "mono", item.data?.toolName ?? ""));
    ctl.append(tool);
    const pretty = JSON.stringify(item.data?.input ?? {}, null, 2);
    if (open) {
      ctl.append(mk("div", "inb-tool", t("inbox.input")));
      const area = mk("textarea", "mono");
      area.value = pretty;
      area.spellcheck = false;
      area.rows = Math.min(14, pretty.split("\n").length + 1);
      area.setAttribute("aria-label", t("inbox.input"));
      const approve = button("primary", t("inbox.approve"), () => void act("approve", {}));
      const edited = button("", t("inbox.approveEdited"), () => { const text = parsed(); if (text !== null) void act("approve", { answer: text }); });
      edited.disabled = true;
      // Edited input must be a JSON object different from the original; returns its compact text or null.
      const parsed = () => {
        if (area.value === pretty) return null;
        try {
          const v = JSON.parse(area.value);
          return v && typeof v === "object" && !Array.isArray(v) ? JSON.stringify(v) : null;
        } catch { return null; }
      };
      area.oninput = () => {
        const text = parsed();
        edited.disabled = text === null;
        err.textContent = t("inbox.inputInvalid");
        err.hidden = text !== null || area.value === pretty;
      };
      const actions = mk("div", "inb-actions");
      actions.append(approve, edited);
      const reject = mk("div", "inb-reject");
      const reason = mk("input");
      reason.placeholder = t("inbox.rejectReason");
      reason.setAttribute("aria-label", t("inbox.rejectReason"));
      const send = () => void act("reject", { answer: reason.value.trim() || undefined });
      reason.onkeydown = e => e.key === "Enter" && send();
      reject.append(reason, button("danger", t("inbox.reject"), send));
      ctl.append(area, actions, reject);
    }
  } else if (item.kind === "question" && open) {
    const options = item.data?.options ?? [];
    if (options.length) {
      const row = mk("div", "inb-actions");
      for (const o of options) row.append(button("", o, () => void act("answer", { answer: o })));
      ctl.append(row);
    } else {
      const area = textInput(3, t("inbox.answerPh"));
      const send = button("primary", t("inbox.send"), () => void act("answer", { answer: area.value.trim() }));
      send.disabled = true;
      area.oninput = () => { send.disabled = !area.value.trim(); };
      area.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && area.value.trim()) send.click(); };
      const row = mk("div", "inb-actions");
      row.append(send);
      ctl.append(area, row);
    }
  } else if (open) {
    const row = mk("div", "inb-actions");
    if (canOpen) row.append(button("", t("inbox.openSession"), () => openRoute(item.route)));
    row.append(button("ghost", t("inbox.dismiss"), () => void act("dismiss", {})));
    ctl.append(row);
  }
  if (!open && item.answer) ctl.append(mk("div", "inb-body", t("inbox.answerIs", { text: item.answer })));
  return el;
}

const DAY = 86_400_000;
async function loadBoard() {
  fillFilter($("boardRoot"), "board.allRoots", roots().map(r => r.route));
  const root = $("boardRoot").value;
  const rows = await getJson(`/api/reqs?limit=200${root ? `&root=${enc(root)}` : ""}`);

}
function paintBoard(rows) {
  const cutoff = Date.now() - DAY;
  const newest = key => (a, b) => (Date.parse(b[key] ?? "") || 0) - (Date.parse(a[key] ?? "") || 0);
  const cols = [
    ["board.open", "work", rows.filter(r => r.status === "open").sort(newest("opened"))],
    ["board.blocked", "bad", rows.filter(r => r.status === "blocked").sort(newest("opened"))],
    ["board.done", "ok", rows.filter(r => (r.status === "done" || r.status === "partial") && r.closed && Date.parse(r.closed) >= cutoff).sort(newest("closed"))],
  ];
  const scroll = [...$("board").querySelectorAll(".col-list")].map(l => l.scrollTop);
  $("board").replaceChildren(...cols.map(([key, h, list], i) => {
    const col = mk("section", "col");
    const head = mk("div", "col-head");
    const dot = mk("span", "dot");
    dot.dataset.h = h;
    head.append(dot, mk("span", "", t(key)), mk("span", "spacer"), mk("span", "mono count", String(list.length)));
    const body = mk("div", "col-list");
    if (!list.length) body.append(mk("p", "empty", t("board.empty")));
    for (const r of list) body.append(reqCard(r));
    col.append(head, body);
    queueMicrotask(() => { body.scrollTop = scroll[i] ?? 0; });
    return col;
  }));
}
function reqCard(r) {

  b.type = "button";
  b.dataset.h = { open: "work", blocked: "bad", partial: "warn", done: "ok" }[r.status] ?? "off";
  const top = mk("div", "req-top");

  if (r.status === "partial") {

  }
  const done = r.status === "done" || r.status === "partial";

const actH = kind => (/fail|error|reject|crash|kill/.test(kind) ? "bad" : /issue|ask|block|exit|stop/.test(kind) ? "warn" : /approv|fire|spawn|start|answer|done/.test(kind) ? "ok" : "off");

  const group = (key, rows, build) => {
    if (!rows?.length) return false;
    const g = mk("section", "hits-group");
    g.append(mk("h4", "", t(key)), ...rows.map(build));
    body.append(g);
    return true;
  };
  const found = [
    group("search.reqs", res?.reqs, r => hit(r.num ?? r.key, r.status, r.title, reqRoute(r))),
    group("search.inbox", res?.inbox, i => hit(i.route, i.kind, i.title, i.route)),
    group("search.conversations", res?.conversations, c => hit(c.route, stamp(c.ts), c.snippet, c.route)),
  ];
  if (!found.some(Boolean)) body.append(mk("p", res ? "empty" : "formerr", t(res ? "search.none" : "conn.down")));
  $("searchDlg").showModal();
}
$("search").onkeydown = e => { if (e.key === "Enter") void runSearch(e.target.value.trim()); };
$("searchClose").onclick = () => $("searchDlg").close();

paintTabs();
paintNotify();
setCounts(0, 0);
setView(view);

await document.fonts.load("13px 'JBMono Nerd'").catch(() => {});
await refresh();
render();
await refreshAux();
setInterval(() => { refreshAux().catch(() => {}); }, 10_000);

// Live state: server pushes the session list on change and a ping every 10 s; silence or error = server down.
let lastMsg = Date.now();
const conn = up => {
  $("conn").hidden = up;
  $("conndot").dataset.h = up ? "ok" : "bad";
  $("conntext").textContent = up ? t("conn.ok") : t("conn.down");
};
function listen() {
  const es = new EventSource("/api/events");
  es.onmessage = e => { lastMsg = Date.now(); conn(true); apply(JSON.parse(e.data)); };
  es.addEventListener("open", () => { lastMsg = Date.now(); conn(true); });
  es.addEventListener("ping", () => { lastMsg = Date.now(); conn(true); }); // SSE comments never reach JS, so the ping is a named event
  es.addEventListener("inbox", onInboxEvent);
  es.onerror = () => conn(false); // EventSource retries by itself
}
setInterval(() => Date.now() - lastMsg > 25_000 && conn(false), 5_000);
listen();
</script>
</body>
</html>
